<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Verifikasi SKBT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg-1: #0f2027; --bg-2: #203a43; --bg-3: #2c5364;
      --text: #f1f5f9; --text-muted: #94a3b8;
      --accent: #38bdf8; --success: #34d399; --danger: #fb7185;
      --border: rgba(255,255,255,0.15);
    }
    body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3)); color: var(--text); min-height: 100vh; padding: 30px; }
    .login-box { max-width: 450px; margin: 80px auto; background: rgba(15,32,39,0.95); border-radius: 20px; padding: 40px; border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.4); animation: fadeUp .8s ease; }
    .login-title { text-align: center; font-size: 1.6rem; font-weight: 800; color: #fff; margin-bottom: 10px; }
    .login-subtitle { text-align: center; color: var(--text-muted); margin-bottom: 30px; font-size: .9rem; }
    .role-selector { display: flex; gap: 10px; margin-bottom: 20px; background: rgba(0,0,0,.3); padding: 8px; border-radius: 50px; border: 1px solid var(--border); }
    .role-btn { flex: 1; background: transparent; border: 1px solid transparent; color: var(--text-muted); padding: 10px; border-radius: 40px; font-weight: 600; transition: all .3s; cursor: pointer; }
    .role-btn.active { background: var(--accent); color: #fff; box-shadow: 0 4px 15px rgba(56,189,248,.4); }
    .form-control { background: rgba(255,255,255,.1); border: 1px solid var(--border); color: #fff; border-radius: 12px; padding: 12px 16px; }
    .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(56,189,248,.2); }
    .btn-gradient { background: linear-gradient(135deg, var(--accent), var(--success)); border: none; color: #fff; font-weight: 700; padding: 14px 32px; border-radius: 50px; width: 100%; margin-top: 10px; }
    .btn-gradient:hover { transform: translateY(-2px); }
    .dashboard { display: none; animation: fadeUp .8s ease; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: rgba(15,32,39,.8); border-radius: 20px; padding: 15px 25px; border: 1px solid var(--border); }
    .header-title h2 { font-size: 1.5rem; font-weight: 800; color: #fff; margin: 0; }
    .header-title p { color: var(--text-muted); font-size: .85rem; margin: 5px 0 0; }
    .btn-outline-light-custom { background: transparent; border: 1px solid var(--border); color: #fff; padding: 10px 20px; border-radius: 50px; }
    .filter-box { background: rgba(255,255,255,.06); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 25px; }
    .form-select { background: rgba(255,255,255,.1); border: 1px solid var(--border); color: #fff; border-radius: 12px; padding: 10px 15px; }
    .form-select option { background: #0f2027; color: #fff; }
    .card-pengajuan { background: rgba(255,255,255,.08); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 15px; transition: all .3s; cursor: pointer; }
    .card-pengajuan:hover { background: rgba(255,255,255,.15); transform: translateX(5px); }
    .modal-content { background: linear-gradient(135deg, #101f2c, #1b2a38); border: 1px solid var(--border); border-radius: 20px; color: #fff; }
    .doc-item { border: 1px solid var(--border); border-radius: 10px; padding: 15px; margin-bottom: 10px; background: rgba(255,255,255,.05); }
    .btn-sm-custom { padding: 6px 12px; font-size: .8rem; border-radius: 20px; border: none; display: inline-flex; align-items: center; gap: 5px; transition: all .3s; }
    .btn-view { background: rgba(56,189,248,.15); color: var(--accent); border: 1px solid var(--accent); }
    .btn-view:hover { background: var(--accent); color: #fff; }
    .btn-approve { background: rgba(52,211,153,.15); color: var(--success); border: 1px solid var(--success); }
    .btn-approve:hover { background: var(--success); color: #fff; }
    .btn-reject { background: rgba(251,113,133,.15); color: var(--danger); border: 1px solid var(--danger); }
    .btn-reject:hover { background: var(--danger); color: #fff; }
    .btn-sm-custom svg { width: 14px; height: 14px; fill: currentColor; }
    .viewer-modal .modal-content { background: #000; border: none; border-radius: 12px; }
    .viewer-modal iframe { width: 100%; height: 85vh; border: none; background: #fff; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-box" id="loginBox">
  <div class="login-title">Admin Verifikasi SKBT</div>
  <div class="login-subtitle">Inspektorat Daerah Kabupaten Mahakam Ulu</div>
  <div class="role-selector">
    <button class="role-btn active" id="btnIrban" onclick="selectRole('irban')">Irban</button>
    <button class="role-btn" id="btnInspektur" onclick="selectRole('inspektur')">Inspektur</button>
  </div>
  <div class="mb-3">
    <label class="form-label" style="color:#94a3b8;">Username</label>
    <input type="text" id="usernameInput" class="form-control" placeholder="Masukkan username">
  </div>
  <div class="mb-3">
    <label class="form-label" style="color:#94a3b8;">Password</label>
    <input type="password" id="passwordInput" class="form-control" placeholder="Masukkan password">
  </div>
  <button class="btn-gradient" onclick="login()">Masuk</button>
  <div class="error-msg" id="loginError"></div>
</div>

<!-- DASHBOARD -->
<div class="container dashboard" id="dashboard">
  <div class="header">
    <div class="header-title">
      <h2>Dashboard Verifikasi SKBT</h2>
      <p id="roleInfo">Role: -</p>
    </div>
    <button class="btn-outline-light-custom" onclick="logout()">Keluar</button>
  </div>
  <div class="filter-box">
    <div class="row g-3">
      <div class="col-md-6">
        <label style="color:#94a3b8;">Filter Status</label>
        <select id="filterStatus" class="form-select mt-2" onchange="loadPengajuan()">
          <option value="all">Semua Status</option>
          <option value="Draft">Draft</option>
          <option value="Sedang Verifikasi">Sedang Verifikasi</option>
          <option value="Diverifikasi oleh Irban">Diverifikasi oleh Irban</option>
          <option value="Menunggu Persetujuan Inspektur">Menunggu Persetujuan Inspektur</option>
          <option value="Disetujui oleh Inspektur">Disetujui oleh Inspektur</option>
          <option value="Ditolak">Ditolak</option>
        </select>
      </div>
      <div class="col-md-6 d-flex align-items-end">
        <button class="btn-outline-light-custom w-100" onclick="loadPengajuan()">Refresh Data</button>
      </div>
    </div>
  </div>
  <div id="pengajuanList"></div>
</div>

<!-- MODAL DETAIL -->
<div class="modal fade" id="detailModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Detail Pengajuan</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="detailBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL VIEWER -->
<div class="modal fade viewer-modal" id="viewerModal" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="viewerTitle">View File</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <iframe id="viewerFrame" src="" allowfullscreen></iframe>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  let currentRole = sessionStorage.getItem('adminRole') || '';
  let currentUsername = sessionStorage.getItem('adminUser') || '';
  let currentDetailId = null;
