<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Verifikasi SKBT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    
    /* TEMA WARNA LEMBUT (Dark Slate) TIDAK SAKIT DI MATA */
    :root {
      --bg-1: #0f2027;
      --bg-2: #203a43;
      --bg-3: #2c5364;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --success: #34d399;
      --danger: #fb7185;
      --surface: rgba(255, 255, 255, 0.08);
      --surface-hover: rgba(255, 255, 255, 0.15);
      --border: rgba(255, 255, 255, 0.15);
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
      color: var(--text);
      min-height: 100vh;
      padding: 30px;
    }

    /* ===== LOGIN BOX ===== */
    .login-box { max-width: 450px; margin: 80px auto; background: rgba(15, 32, 39, 0.95); backdrop-filter: blur(10px); border-radius: 20px; padding: 40px; border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.4); animation: fadeUp 0.8s ease; }
    .login-title { text-align: center; font-size: 1.6rem; font-weight: 800; color: #fff; margin-bottom: 10px; }
    .login-subtitle { text-align: center; color: var(--text-muted); margin-bottom: 30px; font-size: 0.9rem; }
    .role-selector { display: flex; gap: 10px; margin-bottom: 20px; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 50px; border: 1px solid var(--border); }
    .role-btn { flex: 1; background: transparent; border: 1px solid transparent; color: var(--text-muted); padding: 10px; border-radius: 40px; font-weight: 600; transition: all 0.3s; cursor: pointer; }
    .role-btn.active { background: var(--accent); color: #fff; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4); }
    .form-control { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; border-radius: 12px; padding: 12px 16px; transition: all 0.3s; }
    .form-control:focus { background: rgba(255, 255, 255, 0.15); border-color: var(--accent); outline: none; box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.2); }
    .form-control::placeholder { color: rgba(255, 255, 255, 0.4); }
    .btn-gradient { background: linear-gradient(135deg, var(--accent), var(--success)); border: none; color: #fff; font-weight: 700; padding: 14px 32px; border-radius: 50px; box-shadow: 0 8px 25px rgba(52, 211, 153, 0.3); transition: all 0.3s; width: 100%; margin-top: 10px; }
    .btn-gradient:hover { transform: translateY(-2px); box-shadow: 0 12px 35px rgba(52, 211, 153, 0.5); }
    .error-msg { color: var(--danger); font-size: 0.9rem; text-align: center; margin-top: 10px; min-height: 20px; }

    /* ===== DASHBOARD ===== */
    .dashboard { display: none; animation: fadeUp 0.8s ease; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: rgba(15, 32, 39, 0.8); border-radius: 20px; padding: 15px 25px; border: 1px solid var(--border); }
    .header-title h2 { font-size: 1.5rem; font-weight: 800; color: #fff; margin: 0; }
    .header-title p { color: var(--text-muted); font-size: 0.85rem; margin: 5px 0 0; }
    .btn-outline-light-custom { background: transparent; border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; padding: 10px 20px; border-radius: 50px; transition: all 0.3s; }
    .btn-outline-light-custom:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--accent); }

    .filter-box { background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 25px; }
    .form-select { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; border-radius: 12px; padding: 10px 15px; }
    .form-select option { background: #0f2027; color: #fff; }

    .card-pengajuan { background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 15px; transition: all 0.3s; cursor: pointer; }
    .card-pengajuan:hover { background: rgba(255, 255, 255, 0.15); transform: translateX(5px); border-color: rgba(56, 189, 248, 0.5); }
    .badge-custom { padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }

    /* ===== MODAL ===== */
    .modal-content { background: linear-gradient(135deg, #101f2c, #1b2a38); border: 1px solid var(--border); border-radius: 20px; color: #fff; }
    .modal-header { border-bottom: 1px solid rgba(255,255,255,0.1); }
    .modal-footer { border-top: 1px solid rgba(255,255,255,0.1); }
    .doc-item { border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 15px; margin-bottom: 10px; background: rgba(255,255,255,0.05); }
    
    /* ===== TOMBOL VIEW & VERIFIKASI (SVG) ===== */
    .btn-sm-custom { padding: 6px 12px; font-size: 0.8rem; border-radius: 20px; border: none; transition: all 0.3s; display: inline-flex; align-items: center; gap: 5px; }
    .btn-view { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid #38bdf8; }
    .btn-view:hover { background: #38bdf8; color: #fff; }
    .btn-approve { background: rgba(52, 211, 153, 0.15); color: #34d399; border: 1px solid #34d399; }
    .btn-approve:hover { background: #34d399; color: #fff; }
    .btn-reject { background: rgba(251, 113, 133, 0.15); color: #fb7185; border: 1px solid #fb7185; }
    .btn-reject:hover { background: #fb7185; color: #fff; }
    .btn-sm-custom svg { width: 14px; height: 14px; fill: currentColor; }

    /* ===== VIEWER MODAL ===== */
    .viewer-modal .modal-content { background: #000; border: none; border-radius: 12px; }
    .viewer-modal .modal-header { border-bottom: 1px solid rgba(255,255,255,0.1); }
    .viewer-modal .modal-body { padding: 0; }
    .viewer-modal iframe { width: 100%; height: 85vh; border: none; background: #fff; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div class="login-box" id="loginBox">
  <div class="login-title">Admin Verifikasi SKBT</div>
  <div class="login-subtitle">Inspektorat Daerah Kabupaten Mahakam Ulu</div>

  <div class="role-selector">
    <button class="role-btn active" id="btnIrban" onclick="selectRole('irban')">Irban</button>
    <button class="role-btn" id="btnInspektur" onclick="selectRole('inspektur')">Inspektur</button>
  </div>

  <div class="mb-3">
    <label class="form-label" style="color:#94a3b8; font-size:0.85rem; font-weight:600;">Username</label>
    <input type="text" id="usernameInput" class="form-control" placeholder="Masukkan username">
  </div>
  <div class="mb-3">
    <label class="form-label" style="color:#94a3b8; font-size:0.85rem; font-weight:600;">Password</label>
    <input type="password" id="passwordInput" class="form-control" placeholder="Masukkan password">
  </div>
  <button class="btn-gradient" onclick="login()">Masuk</button>
  <div class="error-msg" id="loginError"></div>
</div>

<!-- ================= DASHBOARD ================= -->
<div class="container dashboard" id="dashboard">
  <div class="header">
    <div class="header-title">
      <h2>Dashboard Verifikasi SKBT</h2>
      <p id="roleInfo">Role: -</p>
    </div>
    <button class="btn-outline-light-custom" onclick="logout()">Keluar</button>
  </div>

  <div class="filter-box">
    <div class="row g-3">
      <div class="col-md-6">
        <label style="color:#94a3b8; font-size:0.85rem; font-weight:600;">Filter Status</label>
        <select id="filterStatus" class="form-select mt-2" onchange="loadPengajuan()">
          <option value="all">Semua Status</option>
          <option value="Draft">Draft</option>
          <option value="Sedang Verifikasi">Sedang Verifikasi</option>
          <option value="Menunggu Irban">Menunggu Irban</option>
          <option value="Menunggu Inspektur">Menunggu Inspektur</option>
          <option value="Diverifikasi">Diverifikasi</option>
          <option value="Ditolak">Ditolak</option>
          <option value="Selesai">Selesai</option>
        </select>
      </div>
      <div class="col-md-6 d-flex align-items-end">
        <button class="btn-outline-light-custom w-100" onclick="loadPengajuan()">Refresh Data</button>
      </div>
    </div>
  </div>

  <div id="pengajuanList"></div>
</div>

<!-- ================= MODAL DETAIL ================= -->
<div class="modal fade" id="detailModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Detail Pengajuan</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="detailBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
      </div>
    </div>
  </div>
</div>

<!-- ================= MODAL VIEWER ================= -->
<div class="modal fade viewer-modal" id="viewerModal" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="viewerTitle">View File</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <iframe id="viewerFrame" src="" allowfullscreen></iframe>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const API = '/adminHandler?action=';
  
  let currentRole = sessionStorage.getItem('adminRole') || '';
  let currentUsername = sessionStorage.getItem('adminUser') || '';
  let currentDetailId = null;

  function selectRole(role) {
    currentRole = role;
    document.getElementById('btnIrban').classList.toggle('active', role === 'irban');
    document.getElementById('btnInspektur').classList.toggle('active', role === 'inspektur');
  }

  function login() {
    const username = document.getElementById('usernameInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    const errorMsg = document.getElementById('loginError');
    errorMsg.innerText = '';

    if (!currentRole) {
      errorMsg.innerText = 'Pilih role terlebih dahulu!';
      return;
    }

    fetch(API + 'adminLogin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    })
    .then(r => r.json())
    .then(res => {
      if (res.status === 'success') {
        sessionStorage.setItem('adminRole', res.role);
        sessionStorage.setItem('adminUser', username);
        
        currentUsername = username;
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('roleInfo').innerText = 'Role: ' + (currentRole === 'irban' ? 'Irban' : 'Inspektur') + ' | User: ' + currentUsername;
        loadPengajuan();
      } else {
        errorMsg.innerText = res.msg;
      }
    })
    .catch(err => {
      errorMsg.innerText = 'Koneksi error, coba lagi.';
    });
  }

  function logout() {
    sessionStorage.removeItem('adminRole');
    sessionStorage.removeItem('adminUser');
    
    currentRole = '';
    currentUsername = '';
    document.getElementById('usernameInput').value = '';
    document.getElementById('passwordInput').value = '';
    document.getElementById('loginBox').style.display = 'block';
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('loginError').innerText = '';
    document.getElementById('btnIrban').classList.add('active');
    document.getElementById('btnInspektur').classList.remove('active');
  }

  async function callAdmin(action, params = {}) {
    try {
      const res = await fetch(API + action, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(params)
      });
      return await res.json();
    } catch (e) {
      console.error('Fetch error:', e);
      return { status: 'error', msg: 'Koneksi ke server gagal' };
    }
  }

  async function loadPengajuan() {
    const status = document.getElementById('filterStatus').value;
    const data = await callAdmin('adminGetAllPengajuan', { status });
    const list = document.getElementById('pengajuanList');
    list.innerHTML = '';

    if (!Array.isArray(data) || data.length === 0) {
      list.innerHTML = '<div class="text-center text-muted py-5">Tidak ada pengajuan ditemukan.</div>';
      return;
    }

    data.forEach(item => {
      const badgeClass = item.status_verifikasi === 'Ditolak' ? 'bg-danger' : 
                         (item.status_verifikasi === 'Diverifikasi' || item.status_verifikasi === 'Selesai' ? 'bg-success' : 'bg-warning text-dark');
      list.innerHTML += `
        <div class="card-pengajuan" onclick="showDetail(${item.id})">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h6 class="mb-1" style="color:#fff;">${item.nomor_pengajuan}</h6>
              <p class="mb-1"><strong style="color:#94a3b8;">${item.nama_pemohon}</strong> - ${item.unit_kerja}</p>
              <small style="color:#64748b;">${item.created_at || ''}</small>
            </div>
            <span class="badge ${badgeClass} badge-custom">${item.status_verifikasi}</span>
          </div>
        </div>`;
    });
  }

  async function showDetail(id) {
    currentDetailId = id;
    const data = await callAdmin('adminGetPengajuanById', { id });
    if (!data.submission) return;
    const sub = data.submission;
    const docs = data.documents;
    
    let html = `
      <div class="row mb-3">
        <div class="col-md-6"><strong>Nomor:</strong> ${sub.nomor_pengajuan}</div>
        <div class="col-md-6"><strong>Status:</strong> <span class="badge bg-info text-dark">${sub.status_verifikasi}</span></div>
      </div>
      <div class="row mb-3">
        <div class="col-md-6"><strong>Nama:</strong> ${sub.nama_pemohon}</div>
        <div class="col-md-6"><strong>NIP:</strong> ${sub.nip || '-'}</div>
      </div>
      <div class="row mb-3">
        <div class="col-md-6"><strong>Jabatan:</strong> ${sub.jabatan || '-'}</div>
        <div class="col-md-6"><strong>Unit Kerja:</strong> ${sub.unit_kerja}</div>
      </div>
      <div class="row mb-3">
        <div class="col-md-6"><strong>No HP:</strong> ${sub.nomor_hp || '-'}</div>
        <div class="col-md-6"><strong>Email:</strong> ${sub.gmail || '-'}</div>
      </div>
      <hr>
      <h6 class="mb-3">Dokumen</h6>
      <div id="docList">`;

    docs.forEach(doc => {
      const status = doc.verification_status || 'pending';
      const badge = status === 'approved' ? 'bg-success' : (status === 'rejected' ? 'bg-danger' : 'bg-warning text-dark');
      
      html += `
        <div class="doc-item">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <a href="${doc.file_url}" target="_blank" style="color:#38bdf8; text-decoration:none;">${doc.file_name}</a>
              <br><small style="color:#94a3b8;">${doc.nama_dokumen}</small>
            </div>
            <div class="d-flex align-items-center gap-2">
              <span class="badge ${badge}">${status}</span>
              <button class="btn-sm-custom btn-view" onclick="viewFile('${doc.file_url}', '${doc.file_name}')">
                <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                View
              </button>`;

      // HANYA IRBAN YANG BOLEH VERIFIKASI DOKUMEN PER FILE
      if (currentRole === 'irban') {
        html += `
              <button class="btn-sm-custom btn-approve" onclick="verifDoc(${doc.id}, 'approved')">
                <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                Setujui
              </button>
              <button class="btn-sm-custom btn-reject" onclick="verifDoc(${doc.id}, 'rejected')">
                <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                Tolak
              </button>`;
      }

      html += `
            </div>
          </div>
          ${doc.verification_note ? `<small class="text-muted d-block mt-2">Catatan: ${doc.verification_note}</small>` : ''}`;
      
      // Input catatan hanya untuk Irban
      if (currentRole === 'irban') {
        html += `<input type="text" id="note_${doc.id}" class="form-control form-control-sm mt-2" placeholder="Catatan verifikasi (opsional)" style="background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:#fff;">`;
      }

      html += `</div>`;
    });

    // ===== UPDATE STATUS KESELURUHAN =====
    html += `</div><hr><h6 class="mb-3">Update Status Keseluruhan</h6>
      <select id="newStatus" class="form-select mb-2">`;

    // DROPDOWN BERBEDA UNTUK IRBAN DAN INSPEKTUR
    if (currentRole === 'irban') {
      html += `
        <option value="Draft">Draft</option>
        <option value="Sedang Verifikasi" selected>Sedang Verifikasi</option>
        <option value="Menunggu Irban">Menunggu Irban</option>
        <option value="Menunggu Inspektur">Menunggu Inspektur</option>`;
    } else if (currentRole === 'inspektur') {
      html += `
        <option value="Menunggu Inspektur" selected>Menunggu Inspektur</option>
        <option value="Diverifikasi">Diverifikasi</option>
        <option value="Ditolak">Ditolak</option>
        <option value="Selesai">Selesai</option>`;
    }

    html += `
      </select>
      <input type="text" id="statusNote" class="form-control mb-2" placeholder="Catatan untuk pemohon (opsional)">
      <button class="btn-gradient" style="width:auto; margin-top:10px;" onclick="updateStatus(${sub.id})">Update Status</button>`;

    document.getElementById('detailBody').innerHTML = html;
    
    // Gunakan getOrCreateInstance agar tidak ada modal yang tertinggal
    const modalEl = document.getElementById('detailModal');
    const modalInstance = bootstrap.Modal.getOrCreateInstance(modalEl);
    modalInstance.show();
  }

  // ===== VIEW FILE (Perbaikan: Viewer yang berfungsi) =====
  function viewFile(fileUrl, fileName) {
    const ext = fileName.split('.').pop().toLowerCase();
    let viewerUrl = fileUrl;

    // Gunakan Microsoft Office Viewer untuk file Office
    if (['doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx'].includes(ext)) {
        viewerUrl = 'https://view.officeapps.live.com/op/view.aspx?src=' + encodeURIComponent(fileUrl);
    }
    // Untuk PDF dan gambar, langsung render di iframe (karena browser modern mendukungnya)

    document.getElementById('viewerTitle').innerText = fileName;
    document.getElementById('viewerFrame').src = viewerUrl;
    
    const modalEl = document.getElementById('viewerModal');
    const modalInstance = bootstrap.Modal.getOrCreateInstance(modalEl);
    modalInstance.show();
  }

  // ===== VERIFIKASI DOKUMEN (TANPA MENUTUP MODAL) =====
  async function verifDoc(docId, status) {
    const catatan = document.getElementById('note_' + docId).value;
    const res = await callAdmin('adminUpdateDokumenVerifikasi', { doc_id: docId, status, catatan });
    if (res.status !== 'success') {
      alert('Gagal: ' + res.msg);
      return;
    }
    showDetail(currentDetailId); // Refresh isi modal, TIDAK menutupnya
  }

  // ===== UPDATE STATUS KESELURUHAN (MENUTUP MODAL) =====
  async function updateStatus(id) {
    const status = document.getElementById('newStatus').value;
    const catatan = document.getElementById('statusNote').value;
    const res = await callAdmin('adminUpdateStatusPengajuan', { id, status, catatan });
    if (res.status !== 'success') {
      alert('Gagal: ' + res.msg);
      return;
    }
    
    // PERBAIKAN: Tutup modal dengan benar menggunakan getOrCreateInstance
    const modalEl = document.getElementById('detailModal');
    const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
    modal.hide();
    
    loadPengajuan();
  }

  // ===== INISIALISASI HALAMAN =====
  document.addEventListener('DOMContentLoaded', () => {
    if (currentRole && currentUsername) {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      
      if (currentRole === 'irban') {
        document.getElementById('btnIrban').classList.add('active');
        document.getElementById('btnInspektur').classList.remove('active');
      } else {
        document.getElementById('btnInspektur').classList.add('active');
        document.getElementById('btnIrban').classList.remove('active');
      }
      
      document.getElementById('roleInfo').innerText = 'Role: ' + (currentRole === 'irban' ? 'Irban' : 'Inspektur') + ' | User: ' + currentUsername;
      loadPengajuan();
    } else {
      selectRole('irban');
    }
  });
</script>

</body>
</html>
